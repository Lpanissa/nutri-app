{"name":"Gerar APK","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":"22"}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"Criar projeto Expo base","run":"npx --yes create-expo-app@latest nutri --template blank-typescript --no-install && cd nutri && npm install"},{"name":"Copiar o app","run":"mkdir -p over && unzip -o app.zip -d over && cp -r over/App.tsx over/src over/app.json over/assets over/public over/metro.config.js nutri/"},{"name":"Instalar dependencias do app","run":"cd nutri && npx expo install expo-image-picker @react-native-async-storage/async-storage expo-splash-screen @expo/vector-icons react-dom react-native-web @expo/metro-runtime && npm install firebase"},{"name":"Gerar versao web","run":"cd nutri && npx expo export -p web && cd dist && zip -r ../../mavite-web.zip . && cd ../.. && ls -la mavite-web.zip"},{"name":"Gerar projeto Android","run":"cd nutri && npx expo prebuild --platform android --no-install"},{"name":"Aceitar licencas do Android","run":"yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true"},{"name":"Compilar o APK","run":"cd nutri/android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a"},{"name":"Guardar o APK","run":"cp nutri/android/app/build/outputs/apk/release/app-release.apk mavite.apk && ls -la mavite.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"mavite-apk","path":"mavite.apk"}},{"name":"Publicar link de download","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"gh release delete v2 --yes --cleanup-tag || true; gh release delete v3 --yes --cleanup-tag || true; gh release create v3 mavite.apk mavite-web.zip --title 'Mavité' --notes 'App Mavité'"}]}}}