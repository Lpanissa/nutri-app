{"name":"Gerar APK","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-node@v4","with":{"node-version":"22"}},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"name":"Criar projeto Expo base","run":"npx --yes create-expo-app@latest nutri --template blank-typescript --no-install && cd nutri && npm install"},{"name":"Copiar o app","run":"mkdir -p over && unzip -o app.zip -d over && cp -r over/App.tsx over/src over/app.json nutri/"},{"name":"Instalar dependencias do app","run":"cd nutri && npx expo install expo-image-picker @react-native-async-storage/async-storage"},{"name":"Gerar projeto Android","run":"cd nutri && npx expo prebuild --platform android --no-install"},{"name":"Aceitar licencas do Android","run":"yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true"},{"name":"Compilar o APK","run":"cd nutri/android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a"},{"name":"Guardar o APK","run":"cp nutri/android/app/build/outputs/apk/release/app-release.apk nutri-da-maury.apk && ls -la nutri-da-maury.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"nutri-da-maury-apk","path":"nutri-da-maury.apk"}},{"name":"Publicar link de download","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"gh release delete v1 --yes --cleanup-tag || true; gh release create v1 nutri-da-maury.apk --title 'Nutri da Maury' --notes 'App de nutricao'"}]}}}
