{
  "name": "Gerar APK",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17"
          }
        },
        {
          "name": "Criar projeto Expo base",
          "run": "npx --yes create-expo-app@latest nutri --template blank-typescript --no-install && cd nutri && npm install"
        },
        {
          "name": "Copiar o app",
          "run": "mkdir -p over && unzip -o app.zip -d over && cp -r over/App.tsx over/src over/app.json over/assets over/public over/metro.config.js nutri/"
        },
        {
          "name": "Numero da versao",
          "run": "cd nutri && sed -i \"s/export const BUILD = 0;/export const BUILD = $GITHUB_RUN_NUMBER;/\" src/version.ts && V=\"$(grep -oP 'MAJOR = \\K[0-9]+' src/version.ts).$(grep -oP 'MINOR = \\K[0-9]+' src/version.ts).$GITHUB_RUN_NUMBER\" && node -e \"const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));j.expo.android=j.expo.android||{};j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);j.expo.version=process.argv[1];fs.writeFileSync('app.json',JSON.stringify(j,null,2));\" \"$V\" && cat src/version.ts && echo $V"
        },
        {
          "name": "Instalar dependencias do app",
          "run": "cd nutri && npx expo install expo-image-picker @react-native-async-storage/async-storage expo-splash-screen @expo/vector-icons react-dom react-native-web @expo/metro-runtime && npm install firebase"
        },
        {
          "name": "Gerar versao web",
          "run": "cd nutri && npx expo export -p web && cd dist && zip -r ../../mavite-web.zip . && cd ../.. && ls -la mavite-web.zip"
        },
        {
          "name": "Gerar projeto Android",
          "run": "cd nutri && npx expo prebuild --platform android --no-install"
        },
        {
          "name": "Aceitar licencas do Android",
          "run": "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true"
        },
        {
          "name": "Compilar o APK",
          "run": "cd nutri/android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a"
        },
        {
          "name": "Guardar o APK",
          "run": "cp nutri/android/app/build/outputs/apk/release/app-release.apk mavite.apk && ls -la mavite.apk"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "mavite-apk",
            "path": "mavite.apk"
          }
        },
        {
          "name": "Compilar o pacote da Google Play (AAB assinado)",
          "env": {
            "KEYSTORE_B64": "${{ secrets.KEYSTORE_B64 }}",
            "KEYSTORE_PATH": "${{ github.workspace }}/upload.keystore",
            "KEYSTORE_PASSWORD": "${{ secrets.KEYSTORE_PASSWORD }}",
            "KEY_ALIAS": "${{ secrets.KEY_ALIAS }}",
            "KEY_PASSWORD": "${{ secrets.KEY_PASSWORD }}"
          },
          "run": "if [ -z \"$KEYSTORE_B64\" ]; then echo \"Sem chave de envio configurada: pulando o pacote da Play (AAB).\"; exit 0; fi\necho \"$KEYSTORE_B64\" | base64 -d > \"$GITHUB_WORKSPACE/upload.keystore\"\ncd nutri\nsed -i \"s/export const CANAL: string = 'apk';/export const CANAL: string = 'play';/\" src/version.ts\ngrep -n \"CANAL\" src/version.ts\npython3 - <<'PY'\nimport re\np='android/app/build.gradle'\ns=open(p).read()\nsig=\"    signingConfigs {\\n        release {\\n            storeFile file(System.getenv('KEYSTORE_PATH'))\\n            storePassword System.getenv('KEYSTORE_PASSWORD')\\n            keyAlias System.getenv('KEY_ALIAS')\\n            keyPassword System.getenv('KEY_PASSWORD')\\n        }\\n\"\nassert \"    signingConfigs {\\n\" in s\ns=s.replace(\"    signingConfigs {\\n\",sig,1)\nn=re.subn(r\"(buildTypes \\{.*?release \\{.*?)signingConfig signingConfigs\\.debug\",r\"\\1signingConfig signingConfigs.release\",s,count=1,flags=re.S)\nassert n[1]==1\nopen(p,'w').write(n[0])\nPY\ngrep -n \"targetSdk\\|compileSdk\" android/build.gradle android/gradle.properties || true\ncd android && ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64\ncp app/build/outputs/bundle/release/app-release.aab ../../mavite.aab\nls -la ../../mavite.aab"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "mavite-aab",
            "path": "mavite.aab",
            "if-no-files-found": "ignore"
          }
        },
        {
          "name": "Publicar link de download",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "gh release delete v2 --yes --cleanup-tag || true; gh release delete v3 --yes --cleanup-tag || true; gh release create v3 mavite.apk mavite-web.zip --title 'Mavité' --notes \"build:$GITHUB_RUN_NUMBER versao:$(grep -oP 'MAJOR = \\K[0-9]+' nutri/src/version.ts).$(grep -oP 'MINOR = \\K[0-9]+' nutri/src/version.ts).$GITHUB_RUN_NUMBER\""
        }
      ]
    }
  }
}